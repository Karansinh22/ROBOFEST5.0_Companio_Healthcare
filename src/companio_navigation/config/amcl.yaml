odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map

use_map_topic: true
first_map_only: false

# Initial pose
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0

# Particle filter
min_particles: 100
max_particles: 1000

# Odometry model
odom_model_type: diff
odom_alpha1: 0.2  # Rotation noise from rotation
odom_alpha2: 0.2  # Rotation noise from translation
odom_alpha3: 0.2  # Translation noise from translation
odom_alpha4: 0.2  # Translation noise from rotation

# Laser model
laser_max_range: 12.0
laser_min_range: 0.15
laser_max_beams: 180
laser_z_hit: 0.95
laser_z_rand: 0.05

# Update rates
update_min_d: 0.1  # Minimum translation before update
update_min_a: 0.2  # Minimum rotation before update
resample_interval: 1

transform_tolerance: 0.5
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1
