# Costmap parameters shared by the global and local costmaps (Companio chassis)
footprint: [[-0.15, -0.12], [-0.15, 0.12], [0.15, 0.12], [0.15, -0.12]]
robot_radius: 0.20  # Conservative radius in meters

obstacle_range: 2.5
raytrace_range: 3.0

inflation_radius: 0.15  # Reduced: robot ~30cm wide, 30cm inflation blocked all corridors
cost_scaling_factor: 10.0

observation_sources: laser_scan_sensor

laser_scan_sensor:
  sensor_frame: laser
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true
